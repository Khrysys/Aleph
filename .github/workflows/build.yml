name: Aleph Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - staging

permissions: 
  contents: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ${{ matrix.os }}
    name: Install Dependencies (${{ matrix.title }})
    permissions:
      contents: read
    strategy:
      matrix:
        include: 
          - os: windows-latest
            compiler: default
            title: windows-latest
            conan-home: D:/.conan2
          - os: ubuntu-latest
            compiler: gcc
            title: ubuntu-latest, gcc
            conan-home: /home/runner/.conan2
          - os: ubuntu-latest
            compiler: clang
            title: ubuntu-latest, clang
            conan-home: /home/runner/.conan2
      fail-fast: false
    env:
      CONAN_HOME: ${{ matrix.conan-home }}
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: |
            api.github.com:443
            archives.boost.io:443
            center2.conan.io:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            sourceware.org:443
            zlib.net:443
            ${{ matrix.os == 'ubuntu-latest' && '*.archive.ubuntu.com:80' || '' }}
 
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      
      - name: Setup Conan
        uses: ./.github/actions/setup-conan
        with: 
          compiler: ${{ matrix.compiler }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with: 
          compiler: ${{ matrix.compiler }}

      - name: Upload Lockfile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.compiler }}.conan.lock
          path: conan.lock

  osv-scanner:
    runs-on: ubuntu-latest
    name: OSV Scanner
    needs: 
      - dependencies
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
 
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Conan
        uses: ./.github/actions/setup-conan

      - name: Download Lockfiles
        id: lockfile-download
        uses: actions/download-artifact@v7
        with:
          pattern: '*.conan.lock'
          path: ./lockfiles

      - run: ls -R ${{ steps.lockfile-download.outputs.download-path }}

      - name: Merge Lockfiles
        shell: bash
        run: >-
          conan lock merge 
          --lockfile ${{ steps.lockfile-download.outputs.download-path }}/ubuntu-latest-gcc.conan.lock/conan.lock
          --lockfile ${{ steps.lockfile-download.outputs.download-path }}/ubuntu-latest-clang.conan.lock/conan.lock
          --lockfile ${{ steps.lockfile-download.outputs.download-path }}/windows-latest-default.conan.lock/conan.lock
          --lockfile-out conan.lock

      - name: Run Scanner
        uses: google/osv-scanner-action/osv-scanner-action@8018483926dd235b3013d8c88023e644b9f8e09e # v2.3.3
        with:
          scan-args: |-
            --lockfile=conan.lock
            --lockfile=requirements.txt:docs/requirements.txt
            --lockfile=requirements.txt:.github/requirements/conan.txt
            --output=osv-scanner-results.json 
            --format=json
        continue-on-error: true

      - name: Run Reporter
        uses: google/osv-scanner-action/osv-reporter-action@8018483926dd235b3013d8c88023e644b9f8e09e # v2.3.3
        with: 
          scan-args: |-
            --output=osv-scanner-results.sarif 
            --new=osv-scanner-results.json 
            --gh-annotations=false 
            --fail-on-vuln=false 

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: osv-scanner-results.sarif

  build:
    runs-on: ${{ matrix.os }}
    name: Build Aleph (${{ matrix.title }})
    needs:
      - dependencies
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    strategy:
      matrix:
        include: 
          - os: windows-latest
            compiler: default
            title: windows-latest
            conan-home: D:/.conan2
          - os: ubuntu-latest
            compiler: gcc
            title: ubuntu-latest, gcc
            conan-home: /home/runner/.conan2
          - os: ubuntu-latest
            compiler: clang
            title: ubuntu-latest, clang
            conan-home: /home/runner/.conan2
      fail-fast: false
    env:
      CONAN_HOME: ${{ matrix.conan-home }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: |
            api.github.com:443
            archives.boost.io:443
            center2.conan.io:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            sourceware.org:443
            zlib.net:443
            ${{ matrix.os == 'ubuntu-latest' && '*.archive.ubuntu.com:80' || '' }}
 
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Conan
        id: conan
        uses: ./.github/actions/setup-conan
        with: 
          compiler: ${{ matrix.compiler }}
          
      - name: Build Aleph
        uses: ./.github/actions/build
        with:
          compiler: ${{ matrix.compiler }}
          conan-home: ${{ steps.conan.outputs.conan-home }}

      - name: Package Aleph
        uses: ./.github/actions/package
    
  cpp-linter:
    name: C++ Linter
    runs-on: ubuntu-latest
    needs: 
      - dependencies
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Conan
        uses: ./.github/actions/setup-conan
        with: 
          compiler: gcc

      - name: Build Aleph
        uses: ./.github/actions/build
        with:
          compiler: gcc

      - name: Run cpp-linter
        uses: cpp-linter/cpp-linter-action@24467985494bed9bfc398489b6ec12469beaf4da # v2.17.0
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: file
          extensions: 'c,h,cpp,hpp,inl'
          tidy-checks: 'cppcoreguidelines-*'
          version: '22'
          verbosity: 'info'
          files-changed-only: false
          thread-comments: false
          step-summary: true
          database: ${{ github.workspace }}/build/Release
          ignore: .github|build
          ignore-tidy: .github|build
          ignore-format: .github|build
          tidy-review: true
          format-review: true

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: 
      - dependencies
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
 
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
 
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
 
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Conan
        if: matrix.language == 'c-cpp'
        uses: ./.github/actions/setup-conan
        with:
          compiler: gcc

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0c0c5dc2f136b98cb0537075ccfa21f94cd9a63e # v2.24.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        uses: ./.github/actions/build
        with:
          compiler: gcc

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@0c0c5dc2f136b98cb0537075ccfa21f94cd9a63e # v2.24.3
        with:
          category: "/language:${{matrix.language}}"

  cache-cleanup:
    name: Clean Conan Cache (${{ matrix.title }})
    runs-on: ${{ matrix.os }}
    needs:
        - build
        - osv-scanner
        - codeql
        - cpp-linter
    permissions:
      contents: read
    strategy:
      matrix:
        include: 
          - os: windows-latest
            compiler: default
            title: windows-latest
            conan-home: D:/.conan2
          - os: ubuntu-latest
            compiler: gcc
            title: ubuntu-latest, gcc
            conan-home: /home/runner/.conan2
          - os: ubuntu-latest
            compiler: clang
            title: ubuntu-latest, clang
            conan-home: /home/runner/.conan2
      fail-fast: false
    env:
      CONAN_HOME: ${{ matrix.conan-home }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
 
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Conan
        uses: ./.github/actions/setup-conan
        with:
          compiler: ${{ matrix.compiler }}

      - name: Clean Cache
        shell: bash
        run: |
          conan remove "*" --lru=1w -c