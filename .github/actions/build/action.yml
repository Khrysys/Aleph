name: Build
description: Build Aleph

inputs:
  compiler: 
    description: 
    required: true
  conan-home:
    description: 
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      run: |
        conan build \
          -pr:h="${{ github.workspace }}/.github/profiles/${{ runner.os }}-${{ inputs.compiler }}-host.toml" \
          -pr:b="${{ github.workspace }}/.github/profiles/${{ runner.os }}-${{ inputs.compiler }}-build.toml"