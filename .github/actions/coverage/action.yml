name: Coverage
description: Code coverage with gcov and upload to Coveralls

inputs:
  compiler: 
    description: Changes the conan profile to match the 
    required: true

runs:
  using: composite
  steps:
    - name: Generate reports
      working-directory: build/Debug
      shell: bash
      run: |
        cmake --build . --target aleph_coverage

    - name: Upload Chess Coverage
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        file: ${{ github.workspace }}/build/Debug/chess_coverage.info
        flag-name: Chess Unit Tests
        compare-ref: main
        parallel: true

    - name: Upload Platform Coverage
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        file: ${{ github.workspace }}/build/Debug/platform_coverage.info
        flag-name: Platform Unit Tests
        compare-ref: main
        parallel: true

    - name: Finalize Upload
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        parallel-finished: true