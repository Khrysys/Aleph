name: Package
description: Package Aleph

inputs:
  source:
    description: Whether to package sources or to package binaries.
    required: true
  build-type: 
    description: 
    required: true

runs:
  using: composite
  steps:
    - name: Package Binaries
      if: inputs.source
      shell: bash
      working-directory: build
      run: |
        cpack

    - name: Attest Binary Package
      if: inputs.source
      uses: actions/attest@v4
      with:
        subject-path: '${{ github.workspace }}/aleph-*.7z'

    - name: Upload Binary Artifact
      if: inputs.source
      uses: actions/upload-artifact@v7
      with:
        path: ${{ github.workspace }}/aleph-*.7z
        archive: false

    - name: Package Source
      if: '!inputs.source'
      shell: bash
      working-directory: build/${{ inputs.build-type }}
      run: |
        cpack --config CPackSourceConfig.cmake